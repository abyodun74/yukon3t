services:
  postgres:
    # pgvector/pgvector:pg16 is postgres:16 plus the pgvector extension
    # precompiled — needed for embedding-based semantic search (see
    # src/lib/embeddings.ts). Same Postgres major version as the plain
    # postgres:16-alpine image this replaced, so the existing data volume
    # is still compatible.
    image: pgvector/pgvector:pg16
    container_name: yukon3t-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yukon3tuser
      POSTGRES_PASSWORD: yukon3tpass
      POSTGRES_DB: yukon3tdb
    ports:
      - "5434:5432"
    volumes:
      - yukon3t-postgres-data:/var/lib/postgresql/data

volumes:
  yukon3t-postgres-data:
