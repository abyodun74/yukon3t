ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    // capacitor-camera is the only module using Kotlin, and its own
    // build.gradle explicitly supports this override. Pinned below the
    // default (2.2.20) because that combination hits a reproducible
    // ConcurrentModificationException in Gradle's dependency resolution
    // (AGP's "consistent resolution" version-locking re-entrantly resolving
    // debugRuntimeClasspath while the Kotlin plugin is resolving the same
    // configuration for "friend paths") — confirmed via a clean build with
    // --stacktrace, not a transient/cache issue.
    kotlin_version = '2.0.21'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}