apply plugin: 'com.android.application'

// Loads android/keystore.properties (gitignored, never committed) if it
// exists — lets a release build be signed with the existing TWA app's
// upload keystore (required so this build can replace the TWA as an
// in-place Play Store update rather than becoming a separate listing) while
// still letting the project build cleanly for anyone who hasn't set this up
// yet. Same conditional pattern already used below for google-services.json.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.yukon3t.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yukon3t.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Must exceed the highest versionCode Play has ever seen for
        // com.yukon3t.app across every track (including old/unpublished
        // drafts on the pre-existing TWA listing) — confirmed as 3, so this
        // starts at 4. Bump this on every subsequent release.
        // 6: adds native background/asleep call handling (CallMessagingService,
        // CallForegroundService) — see android/SUBMISSION.md section 9 for the
        // new USE_FULL_SCREEN_INTENT Play Console declaration this needs.
        // 7: extends CallForegroundService to cover the whole call, not just
        // ringing (CallForegroundPlugin), plus the ignore-battery-optimizations
        // prompt for OEM battery managers (Samsung's One UI, notably) that
        // otherwise freeze the process mid-call — see SUBMISSION.md section 10
        // for the new REQUEST_IGNORE_BATTERY_OPTIMIZATIONS declaration this needs.
        // 8: hardens the whole call path (CallForegroundService,
        // CallForegroundPlugin, CallActionReceiver, CallMessagingService)
        // against an uncaught exception crashing the entire app — reported
        // as app-wide crashes on Android 16 specifically while a call was
        // ringing/active, most likely from newer OS-level enforcement around
        // startForeground()/notification behavior that wasn't previously
        // strict enough to throw. No exact repro/stack trace was available,
        // so this is defensive (fail-safe, degrade gracefully) rather than a
        // fix for one identified line.
        // 9: the actual root cause behind 8, found via on-device logcat —
        // Android 16 (targetSdk 36) requires MANAGE_OWN_CALLS (or the
        // DIALER role) in addition to FOREGROUND_SERVICE_PHONE_CALL to
        // start a foregroundServiceType="phoneCall" service; without it,
        // startForeground() threw and the ring fell back to a plain
        // (non-foreground, non-Doze-exempt) notification. Adding the
        // permission is the real fix; version 8's try/catch hardening stays
        // as defense in depth.
        // 10: removed CallActionReceiver — its BroadcastReceiver-mediated
        // context.startActivity() call to launch MainActivity from a
        // notification's Accept/Decline action was intermittently silent
        // on-device (Samsung/Android 16): no exception, the tap just didn't
        // open the app. The notification's Accept/Decline PendingIntents now
        // launch MainActivity directly (PendingIntent.getActivity), the same
        // always-reliable path the notification body tap already used;
        // MainActivity.onCreate/onNewIntent now does the immediate
        // stop-ringing/cancel-notification work the receiver used to do.
        // 11: adds READ_CONTACTS + @capacitor-community/contacts for the
        // "Choose from contacts" invite flow — the previous implementation
        // relied on the web Contact Picker API (navigator.contacts), which
        // isn't available inside this app's WebView, so the button silently
        // did nothing on-device. See android/SUBMISSION.md section 13 before
        // the next release — READ_CONTACTS needs its own Play Console
        // data-safety disclosure even though it isn't a Restricted Permission.
        // 12: adds native missed-call notifications (CallForegroundService,
        // CallMessagingService) — held back since 907c8cf pending Play Store
        // production access, now unlocked.
        // 13: adds VolumeButtonPlugin — forwards the hardware volume-up key
        // (MainActivity.onKeyDown) to JS so feed videos can auto-unmute,
        // matching mainstream apps. Purely observational, never consumes
        // the key event or touches any audio stream itself.
        // 14: fixes incoming calls being unanswerable when the phone is
        // locked/asleep — MainActivity never declared it could draw over a
        // locked screen, so the incoming-call notification's full-screen
        // presentation (and its Accept/Decline actions) launched behind the
        // keyguard instead of actually surfacing the call. Now calls
        // setShowWhenLocked/turnScreenOn (falling back to the equivalent
        // window flags below API 27) and requests the keyguard dismiss
        // (API 26+) for any yukon3t://call intent, reverted 30s later. No
        // new permission and no new Play Console declaration — these are
        // plain Activity/Window APIs, not Restricted Permissions.
        // 15: turns on R8 minification/shrinking/optimization for release
        // builds (was off — Play Console's post-upload panel flagged "App
        // optimization: Low" / "Obfuscation: 2%"), with proguard-rules.pro's
        // yukon3t-specific keep rules for the manifest-instantiated call
        // services and the @PluginMethod Capacitor plugins. Unlike 14, this
        // is genuinely risky to ship blind — an R8 misconfiguration fails
        // silently at runtime (calls/push/plugin methods just stop working,
        // no build error) — needs a real on-device test pass before this
        // versionCode is the one that actually gets uploaded.
        versionCode 15
        versionName "1.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Was false — Play Console's post-upload quality panel flagged
            // "App optimization: Low" / "Obfuscation: 2%" since R8 barely
            // ran. This app is a thin WebView shell (the real app logic is
            // JS served live from yukon3t.com, untouched by any of this) —
            // the actual benefit is a smaller native-shell download plus a
            // modest reverse-engineering bar on the small amount of native
            // Java here, not a meaningful security uplift for the app as a
            // whole. proguard-rules.pro's yukon3t-specific keep rules are
            // what make this safe to flip: without them, R8 could strip or
            // rename the manifest-instantiated call services or any
            // @PluginMethod Capacitor calls from JS with no compile error.
            // Needs a real on-device test pass (calls, push, camera,
            // contacts, volume button) before this build ships — an R8
            // misconfiguration fails silently at runtime, not at build time.
            minifyEnabled true
            shrinkResources true
            // "-optimize" variant (omits classic ProGuard's -dontoptimize)
            // so R8 actually performs its optimization passes, not just
            // shrinking/obfuscation — this is specifically what Play
            // Console's "R8 configuration" advisory was asking for.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned (a plain assembleRelease/bundleRelease still succeeds,
            // just produces an unsigned artifact) until keystore.properties
            // exists — see the comment above.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // CallMessagingService (see src/main/java/com/yukon3t/app/) extends
    // FirebaseMessagingService directly, so unlike other Firebase usage in
    // this app — which only goes through the @capacitor-firebase/messaging
    // plugin's own :capacitor-firebase-messaging module — the app module
    // needs its own compile dependency here; that plugin module declares
    // this as `implementation`, so it isn't exposed transitively to :app.
    // Version pinned to match that module's own default
    // (node_modules/@capacitor-firebase/messaging/android/build.gradle's
    // firebaseMessagingVersion) so both resolve to the same Firebase
    // Messaging SDK version on the shared classpath.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
