[build]
  command = "sh scripts/migrate-if-production.sh && next build --webpack"
  publish = ".next"

# The type-check step of `next build --webpack` ran out of Node's default heap (about 2 GB) on 2026-11-14
# ("JavaScript heap out of memory" -> "Failed to type check"), failing every Netlify build. Netlify build
# machines have more memory than that default allows Node to use; raise the ceiling for the build only.
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=6144"
  # Netlify's secrets scan fails the build when the VALUE of a secret-looking environment variable shows up in the repo
  # or the build output. APNS_TEAM_ID holds the Apple Team ID (3465L6ZHRJ), which is public by design: it is in the
  # /.well-known/apple-app-site-association file every iPhone downloads (src/lib/app-links.ts), so the scan flagged that
  # file on 2026-11-15 and failed the build. Skip only this one key; every other secret is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "APNS_TEAM_ID"

# Next.js 16 defaults to Turbopack, but Netlify's Next.js Runtime edge
# function bundler fails on Turbopack's compiled middleware output
# (a "[turbopack]_runtime.js" chunk it can't resolve). Webpack output is
# unaffected. Scoped to netlify.toml only — Vercel keeps using the default
# Turbopack build via `npm run build`.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify serves public/ itself, so the gift art caching in next.config.ts's headers() is repeated here. The gift icons'
# file names carry a hash of their bytes (scripts/slice-gift-art.py), so they never change: immutable. The 3D models
# keep stable names: a day.
[[headers]]
  for = "/gifts/art/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gifts/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
